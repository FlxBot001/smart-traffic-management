apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-traffic-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: smart-traffic.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smart-traffic-service
                port:
                  number: 80
